name: Build InvenTree APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Шаг для поиска и перехода в папку с проектом (если папка другая — укажем её)
      - name: Install dependencies
        run: flutter pub get
        # Если проект лежит в корне, но структура подпапок отличается, 
        # можно указать рабочий каталог. По умолчанию проверяем корень.

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventree-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
