name: Build InvenTree APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./apps/inventree-app # Указываем путь к папке с мобильным клиентом

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./apps/inventree-app # Тоже указываем рабочую директорию

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventree-release-apk
          path: apps/inventree-app/build/app/outputs/flutter-apk/app-release.apk
